# drum-JEPA v2 + option A: aux_rec 0.1 on 12 training kits (configs/kits_v2.yaml).
#
# What this pair tests. v1's follow-ups measure a held-out content margin: the
# fixed-mask readout ratio is 0.92-1.00 on train kits and clearly lower on the 8
# held-out kits, and the aux_rec 0.1 run's E5 onset score drops from ~0.58 train
# to ~0.40 held out. One explanation is that 6 training kits are too few for the
# encoder to learn anything kit-general. This pair doubles the training kits to
# 12 while holding the SAME 8 kits out, so the held-out audio is identical and
# the only variable that moves is training-kit diversity. Its partner is
# configs/drumjepa_v2_12k.yaml (the unregularized baseline);
# baseline vs aux at 12 kits repeats the v1 comparison at higher diversity.
#
# NORMALIZATION WARNING. data/cache/v2 has its own stats.json: the mel mean/std
# come from the v2 train split, which is a different set of kits than v1's. Loss
# values, prediction errors and any quantity in normalized mel units from these
# runs are NOT comparable to v1's numbers (notes/decisions.md, "Mel
# normalization"). Compare within this pair, or use scale-free quantities:
# E1/E2 win rates, probe scores, and the readout train-vs-heldout ratio.
#
# Cost. The dataset reports 79,386 pairs on v1's 6 kits (620 steps/epoch at
# batch 128); pairs scale with the kit count, so 12 kits gives ~158,800 pairs
# and ~1,240 steps/epoch. At v1's ~3.5 min/epoch that is ~7 min/epoch, so
# ~2 h 20 min for 20 epochs on the M5 Max, per run.
#
# Hyperparameters follow the Music-JEPA paper (CLAUDE.md, "Training"): Adam
# lr 6e-4, wd 1e-4, batch 128, 15-25 epochs, lambda 0.5, tau 0.95. Details the
# paper leaves open are in notes/decisions.md; the model reads them from the
# `model` section, which is empty here so drumjepa.model.DrumJEPA defaults win.
run:
  name: drumjepa_v2_12k_auxrec01
  seed: 0

data:
  cache_dir: data/cache/v2
  split_version: v2
  MAP_VERSION: v1
  train_kits:                   # configs/kits_v2.yaml train_kits, verbatim
    - Jazz
    - 60s Rock
    - Studio (Live Room)
    - Cassette (Lo-Fi Compress)
    - Ele-Drum
    - 808 Simple
    - Modern Funk
    - Arena Stage
    - Tight Prog
    - Rockin Gate (80s)
    - Super Boom (Layered)
    - Nu RNB
  seg_hop: 200                  # frames between segment starts; 200 = no overlap
  workers: 4
  val_pairs: 2048               # fixed random subset of validation (same kits)

model: {aux_rec: 0.1}   # option A: reconstruct a_t from s_t (notes/decisions.md)
  # Defaults live in drumjepa/model.py; uncomment to override. See notes/decisions.md.
  # d_model: 256
  # d_ff: 512
  # n_heads: 4
  # enc_s_layers: 12            # E_s
  # enc_a_layers: 8             # E_a
  # pred_layers: 6              # f and g
  # state_patch: [25, 15]       # frames x mel bins on the 200x240 padded mel -> 8x16 tokens
  # action_patch_frames: 25     # one action token per 250 ms -> 8 tokens
  # mask_ratio: 0.75            # I-JEPA multi-block on s_{t+1}; random on a_{t+1}
  # lambda_a: 0.5               # loss = loss_s + lambda_a * loss_a
  # tau: 0.95                   # teacher EMA, one update per optimizer step
  # mask_blocks: 4              # mask_scale: [0.15, 0.2], mask_aspect: [0.75, 1.5]

optim:
  optimizer: adamw
  lr: 6.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.95]
  batch_size: 128
  epochs: 20
  warmup_steps: 500             # linear warmup, then cosine
  min_lr_factor: 0.1            # cosine floor = min_lr_factor * lr
  grad_clip: 1.0

# bf16 autocast on MPS/CUDA (ignored on CPU). The whole forward and loss stay
# inside the autocast block: a bf16 activation reaching an fp32 Linear outside it
# aborts the MPS process with no Python exception (notes/mps_fixes.md, 2026-09-04).
# The EMA update runs in fp32 on the raw parameters, outside autocast.
amp: true
